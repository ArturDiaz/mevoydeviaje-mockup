<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevoydeviaje.com</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-index icons-svg text-3.5">
    <script src="pages/shared/icons/IconSVG.js"></script>
    <script src="pages/shared/header/_header.js"></script>
    <main class="w-responsive py-7 pb-15">
        <script src="pages/shared/formSearch/_formSearch.js"></script>

        <!-- Banner principal (igual que mevoydeviaje.com): debajo del buscador; en desktop
             ocupa todo el ancho y el buscador flota sobre su borde superior; version mobile hasta 768px -->
        <a href="https://www.mevoydeviaje.com/descuentos" class="hero-banner">
            <picture>
                <source media="(max-width: 768px)" srcset="img/banner/banner-mobile.webp">
                <img src="img/banner/banner-pc.webp" alt="Descuentos" fetchpriority="high" width="1600" height="400">
            </picture>
        </a>

        <section class="section-products">
            <div class="product-grid mt-15 flex-c gap-5">
                <h2 class="section-title text-c hidden">Vuelos baratos irrepetibles</h2>
                <!-- Tarjetas generadas por js/offers.js (precio, aerolinea y fechas "dinamicos") -->
                <div class="offers-header flex-r jc-b ai-c gap-3">
                    <h2 class="section-title">Vuelos baratos a destinos internacionales</h2>
                    <a href="" class="offers-more btn btn-blue-outline">Ver más ofertas</a>
                </div>
                <div class="item-grid grid cl-2 lg:cl-4 gap-4" data-offers="internacional"></div>
                <div class="offers-header flex-r jc-b ai-c gap-3 mt-5">
                    <h2 class="section-title">Lo mejor en vuelos baratos nacionales</h2>
                    <a href="" class="offers-more btn btn-blue-outline">Ver más ofertas</a>
                </div>
                <div class="item-grid grid cl-2 lg:cl-4 gap-4" data-offers="nacional"></div>
            </div>
        </section>

        <!-- Categorias de paquetes (igual que mevoydeviaje.com): el texto va dentro de la imagen -->
        <section class="section-categories mt-15 flex-c gap-5">
            <div class="flex-c ai-c text-c gap-1">
                <h2 class="section-title">Empieza tu próxima aventura</h2>
                <p class="c-scale-500">Explora destinos increíbles y encuentra la mejor opción ideal para ti.</p>
            </div>
            <div class="item-grid flex-c min-md:grid min-md:cl-3 gap-4">
                <a href="" class="category-card" title="Playas del Caribe">
                    <img src="https://www.mevoydeviaje.com/images/thumbs/0000868_playas-del-caribe_350.webp" alt="Playas del Caribe" loading="lazy">
                </a>
                <a href="" class="category-card" title="Paquetes con Descuento">
                    <img src="https://www.mevoydeviaje.com/images/thumbs/0000869_paquetes-con-descuento_350.webp" alt="Paquetes con Descuento" loading="lazy">
                </a>
                <a href="" class="category-card" title="Paquetes nacionales">
                    <img src="https://www.mevoydeviaje.com/images/thumbs/0000870_paquetes-nacionales_350.webp" alt="Paquetes nacionales" loading="lazy">
                </a>
                <a href="" class="category-card" title="Destinos Sudamérica">
                    <img src="https://www.mevoydeviaje.com/images/thumbs/0000873_destinos-sudamerica_350.webp" alt="Destinos Sudamérica" loading="lazy">
                </a>
                <a href="" class="category-card" title="Europa">
                    <img src="https://www.mevoydeviaje.com/images/thumbs/0000872_europa_350.webp" alt="Europa" loading="lazy">
                </a>
                <a href="" class="category-card" title="Año Nuevo">
                    <img src="https://www.mevoydeviaje.com/images/thumbs/0000874_ano-nuevo_350.webp" alt="Año Nuevo" loading="lazy">
                </a>
            </div>
        </section>
    </main>
    <script src="pages/shared/footer/_footer.js"></script>

    <script src="js/scriptCss.js"></script>
    <script src="js/destinations-data.js"></script>
    <script src="js/offers.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
